name: 项目任务
description: 记录目标、验收条件、进度与验证证据。
title: "[任务] "
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标与范围
      description: 谁需要什么，以及本次任务涉及哪些工作。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 写出可以检查的完成条件；任务拆分可使用复选框。
      placeholder: "- [ ] 可复核的完成条件"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 进度、验证与阻塞
      description: 记录实际结果、命令、关联提交或 PR，以及尚待解决的问题。
